# GoReleaser config — builds cross-platform static binaries and cuts a GitHub
# Release when a v* tag is pushed. Run locally with `goreleaser release --clean`
# (needs GITHUB_TOKEN); CI runs it via .github/workflows/release-completer.yml on tag.
version: 2

project_name: ltk

before:
  hooks:
    - go mod download

builds:
  - id: ltk
    main: ./cmd/ltk
    binary: ltk
    env:
      - CGO_ENABLED=0 # no libc linkage at all → static on every target
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # not a release target
    # Pure-Go resolvers (no libc) so linux/windows binaries are unambiguously
    # static even if CGO ever gets re-enabled.
    tags:
      - netgo
      - osusergo
    flags:
      - -trimpath
    # -extldflags=-static forces static linking when an external linker is used
    # (no-op under CGO_ENABLED=0, harmless on darwin which can't fully static-link).
    # Stamp main.Version with the tag (e.g. v1.2.3), matching `ltk --version`.
    ldflags:
      - -s -w -extldflags=-static -X main.Version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - id: ltk
    formats: [tar.gz]
    # Windows users get a zip instead.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Homebrew cask published to the shared ctxloom tap (matches ctxloom's own
# packaging). macOS users:  brew install ctxloom/tap/ltk
#
# Cross-repo push needs a PAT with contents:write on the tap, provided as the
# HOMEBREW_TAP_GITHUB_TOKEN secret (wired in release-completer.yml) — the per-repo
# GITHUB_TOKEN cannot push to another repository. The post-install hook strips the
# macOS quarantine attribute so the unsigned binary launches without a Gatekeeper
# prompt. Casks are macOS-only; Linux/Windows users use the release archives.
homebrew_casks:
  - name: ltk
    binary: ltk
    repository:
      owner: ctxloom
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/ctxloom/llm-tool-killer"
    description: "Pre-tool hook that redirects an LLM agent's shell commands to the project's preferred command"
    license: "BSD-3-Clause"
    # Don't push a cask for prereleases (e.g. v0.0.1-rc.1) or snapshots — only
    # real tags update the tap.
    skip_upload: auto
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ltk"]
          end

release:
  draft: false
  prerelease: auto # tags like v1.2.3-rc1 are marked pre-release
  footer: |
    ---
    Install: `brew install ctxloom/tap/ltk` (macOS),
    `go install github.com/ctxloom/llm-tool-killer/cmd/ltk@{{ .Tag }}`,
    or download a binary above and run `ltk manage install`.
