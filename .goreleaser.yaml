# GoReleaser config — builds cross-platform static binaries and cuts a GitHub
# Release when a v* tag is pushed. Run locally with `goreleaser release --clean`
# (needs GITHUB_TOKEN); CI runs it via .github/workflows/release.yml on tag.
version: 2

project_name: ltk

before:
  hooks:
    - go mod download

builds:
  - id: ltk
    main: ./cmd/ltk
    binary: ltk
    env:
      - CGO_ENABLED=0 # no libc linkage at all → static on every target
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64 # not a release target
    # Pure-Go resolvers (no libc) so linux/windows binaries are unambiguously
    # static even if CGO ever gets re-enabled.
    tags:
      - netgo
      - osusergo
    flags:
      - -trimpath
    # -extldflags=-static forces static linking when an external linker is used
    # (no-op under CGO_ENABLED=0, harmless on darwin which can't fully static-link).
    # Stamp main.Version with the tag (e.g. v1.2.3), matching `ltk --version`.
    ldflags:
      - -s -w -extldflags=-static -X main.Version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - id: ltk
    formats: [tar.gz]
    # Windows users get a zip instead.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Homebrew formula published to the shared ctxloom tap. macOS users:
#   brew install ctxloom/tap/ltk
brews:
  - name: ltk
    repository:
      owner: ctxloom
      name: homebrew-tap
      # Cross-repo push needs a PAT with `contents:write` on homebrew-tap; the
      # default GITHUB_TOKEN only covers this repo. Provided as the
      # HOMEBREW_TAP_GITHUB_TOKEN secret (wired in .github/workflows/release.yml).
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ctxloom/llm-tool-killer"
    description: "Pre-tool hook that redirects an LLM agent's shell commands to the project's preferred command"
    license: "BSD-3-Clause"
    # Don't push a formula for prereleases (e.g. v0.0.1-rc1) or snapshots — only
    # real tags update the tap.
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: noreply@abbitt.me
    test: |
      system "#{bin}/ltk", "--version"
    install: |
      bin.install "ltk"

release:
  draft: false
  prerelease: auto # tags like v1.2.3-rc1 are marked pre-release
  footer: |
    ---
    Install: `brew install ctxloom/tap/ltk` (macOS),
    `go install github.com/ctxloom/llm-tool-killer/cmd/ltk@{{ .Tag }}`,
    or download a binary above and run `ltk manage install`.
