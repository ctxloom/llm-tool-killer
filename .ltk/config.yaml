# llm-tool-killer dogfooding its own rules against this repo.
#
# This is the rule set the `ltk` PreToolUse hook (registered in
# .claude/settings.json) enforces against agents working in THIS repository.
# Commands an agent proposes are parsed into a command graph and matched here;
# the first matching `deny` wins and its message/suggest is returned to the
# agent so it retries the project's way. See docs/RULES.md for the full model.
#
# Rule mode (default enable): enable = firm denial; confirm = re-run the exact
# command after the delay and within the window to proceed; disable = inert.
# Override state for confirm lives next to this file in .ltk/state.json (gitignored).
version: 1

defaults:
  on_parse_error: allow      # command unparseable → allow (fail-open), the cooperative default
  repeat_window_seconds: 30  # window for `mode: confirm` rules
  repeat_delay_seconds: 10   # ignore an immediate confirm-repeat this long (kills the reflexive bypass)

rules:
  # Workflow redirects: mode: confirm so you can still run the raw command in a
  # pinch by repeating it. Tests/build/vet go through the task runner so flags
  # and env stay consistent (and `just check` is the one command CI runs).
  - id: tests-via-just
    match: { command: [go, test] }
    mode: confirm
    message: "Run tests through the task runner so the whole suite (incl. the README-driven acceptance tests) runs the same way CI does."
    suggest: "just test"

  - id: build-via-just
    match: { command: [go, build] }
    mode: confirm
    message: "Use the task runner so the version is stamped and the static (CGO-free) binary lands in ./bin/ltk."
    suggest: "just build      # or: just build-static"

  - id: vet-via-just
    match: { command: [go, vet] }
    mode: confirm
    message: "Vet through the task runner."
    suggest: "just vet        # or: just check (fmt-check + vet + complexity + test)"

  - id: golangci-lint-incompatible
    match: { command: golangci-lint }
    mode: confirm
    message: "golangci-lint v1.64.8 is built with go1.24 and refuses this go1.25 module. Use the gocyclo-based gate."
    suggest: "just complexity # or: just check"

  # Releases go through Versionator, never a hand-cut tag. Firm (default enable),
  # but read-only listing is exempt.
  - id: no-manual-git-tag
    match:
      command: [git, tag]
      unless: ["--list", "-l", "-n", "--contains", "--points-at"]
    message: "Don't hand-cut tags. Releases are merge-triggered: bump VERSION (`just set-version <v>`), open a PR, merge — CI tags it. See docs/RELEASING.md."

  # A plain force-push can clobber a teammate's work; --force-with-lease won't.
  - id: no-force-push
    match: { command: [git, push, --force] }
    message: "A plain force-push can overwrite a teammate's commits."
    suggest: "git push --force-with-lease"

  # --- Footgun guards. These stay firm (mode: enable, the default), so repeating
  # the command does NOT get it through; the message points at the safer path. ---

  # Gaming the gate with --no-verify.
  - id: no-skip-commit-hooks
    match: { command: [git, commit, --no-verify] }
    message: "Don't bypass commit hooks with --no-verify — fix what the hook flags (run `just check`), then commit."
  - id: no-skip-push-hooks
    match: { command: [git, push, --no-verify] }
    message: "Don't bypass push hooks with --no-verify — fix the failure, then push."

  # Losing uncommitted work.
  - id: reset-hard-stash-first
    match: { command: [git, reset, --hard] }
    message: "`git reset --hard` throws away uncommitted work irreversibly. Stash or commit first."
    suggest: "git stash --include-untracked"
  - id: git-clean-stash-first
    match:
      command: [git, clean]
      unless: ["-n", "--dry-run"]   # previewing is safe
    message: "`git clean` deletes untracked files for good. Preview with `-n`, or stash instead."
    suggest: "git stash --include-untracked"

  # Over-broad staging. Not firm: blanket staging is usually a smell (it sweeps
  # in files the task never touched), but when the change genuinely spans a large
  # file set, `git add -A` is fine — even preferable to a long path list. So this
  # nudges by default and lets you confirm by repeating.
  - id: stage-explicitly
    match: { command: [git, add], args_any: ["-A", "--all", "."] }
    mode: confirm
    message: "Prefer staging the paths this change actually touches. If the change really does span many files, run the same command again to stage them all."
    suggest: "git add <path> [<path> …]"

  # Rewriting commit identity.
  - id: no-rewrite-git-identity
    match: { command: [git, config], args_any: ["user.email", "user.name"] }
    message: "Don't change the git identity from inside the agent; set it once in your own global config."

  # Irreversible recursive delete (bundled -rf/-fr split to {-r,-f}).
  - id: rm-rf-careful
    match: { command: rm, args_all: ["-r", "-f"] }
    message: "Double-check the path before a recursive force-delete. For build artifacts use `just clean`; otherwise delete specific paths."
    suggest: "just clean"

  # Privilege escalation has no place in an unattended agent loop.
  - id: no-sudo
    match: { command: sudo }
    message: "Don't escalate privileges from inside the agent — ask a human to run anything that genuinely needs sudo."

  # Killing processes by name is a blunt instrument (wrong PID, your editor, a
  # sibling agent). Target a specific PID or the dev task you started.
  - id: no-pkill
    match: { command: pkill }
    message: "Avoid pkill/killall by name — find the specific PID and `kill` that, or stop the task you started."
  - id: no-killall
    match: { command: killall }
    message: "Avoid pkill/killall by name — find the specific PID and `kill` that, or stop the task you started."

  # Whole-tree reformat produces enormous, review-hostile diffs.
  - id: gofmt-via-just
    match: { command: gofmt, args_any: ["-w"] }
    message: "Don't reformat the whole tree by hand."
    suggest: "just fmt"

  # File-edit rule (path, not command): the version is owned by Versionator.
  # Editing the VERSION file by hand desyncs it from the tag/release flow.
  - id: no-hand-edit-version
    match: { path: [VERSION] }
    message: "Don't hand-edit VERSION — it's managed by Versionator. Use `just bump` (or `versionator set <v>`), then `just release`."

  # File-edit rules: don't disturb pinned git submodules. Firm (enable) — a
  # submodule's contents belong to its own repo, so there's no correct override.
  # `@submodules` expands to every path in .gitmodules (inert while there are
  # none, so this is safe to carry ahead of any submodule landing here).
  - id: no-edit-submodules
    match: { path: ["@submodules"] }
    message: "This file is inside a git submodule (a pinned, separate repo). Edit it in that submodule's own repo and commit there — never from the superproject. This is firm; there is no override."
  - id: no-edit-gitmodules
    match: { path: [.gitmodules] }
    message: "Don't hand-edit .gitmodules — use `git submodule add`/`deinit` so the config and the recorded gitlink stay in sync."
